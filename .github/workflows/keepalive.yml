# Free-tier Supabase pauses a project after ~7 days without traffic, which takes
# the whole app down (that's what happened in July–October 2026). This pings the
# API every 3 days; /keepalive runs a tiny database query to keep it active.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    # Only in the public website repo (the private source repo has no Pages).
    if: github.repository == 'Mausertheking/ecolens'
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive
        run: curl -fsS --retry 3 --retry-delay 30 --max-time 60 https://zvpjiwlgysbvhhbfnwpm.supabase.co/functions/v1/api/keepalive
